name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.24.2", "stable"]
    steps:
      - uses: actions/checkout@v4

      - name: Spec number uniqueness
        run: scripts/check-spec-numbers.sh

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Format check
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test ./... -race -coverprofile=coverage.out

      - name: Build binaries
        run: |
          go build -trimpath -o bin/drove ./cmd/drove
          go build -trimpath -o bin/droved ./cmd/droved

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.go }}
          path: coverage.out

  workspace-runtime:
    name: Workspace Runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache: true

      - name: Test workspace
        run: go test ./internal/workspace -count=1 -timeout=20m

  workspace-platform-compile:
    name: Workspace Platform Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache: true

      - name: Compile workspace platform families
        run: scripts/check-workspace-platforms.sh
